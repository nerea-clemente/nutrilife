# Ejemplo para Fly.io — cambia "app" por un nombre único.
app = "nutrilife-diario"
primary_region = "mad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "nutrilife_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
